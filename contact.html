<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - TOKO COOKIES</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="page-heading">
    <p class="small-title">WE'D LOVE TO HEAR FROM YOU</p>
    <h1>Contact <span>Us</span></h1>
    <p>Hubungi kami untuk informasi dan pemesanan.</p>
</section>

<section class="contact-container">

    <div class="contact-card">
        <h2>Let's Get In Touch ♡</h2>

        <div class="contact-info">
            <h3>📍 Address</h3>
            <p>Bandung, Jawa Barat, Indonesia</p>
        </div>

        <div class="contact-info">
            <h3>📧 Email</h3>
            <p>tokocookies@example.com</p>
        </div>

        <div class="contact-info">
            <h3>📱 Instagram</h3>
            <p>@tokocookies</p>
        </div>

        <div class="contact-info">
            <h3>⏰ Opening Hours</h3>
            <p>Senin - Sabtu: 09.00 - 18.00 WIB</p>
        </div>
    </div>

    <div class="contact-form">
        <h2>Send Us a Message</h2>

        <form onsubmit="sendMessage(event)">
            <input type="text" placeholder="Nama kamu" required>
            <input type="email" placeholder="Email kamu" required>
            <textarea placeholder="Tulis pesan kamu..." required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

</section>

<div class="back-area">
    <button class="back-btn" onclick="history.back()">← Back</button>
</div>

<script src="script.js"></script>
</body>
</html>
